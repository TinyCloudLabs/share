services:
  share-api:
    image: ${SHARE_API_IMAGE:?set SHARE_API_IMAGE to the exact merged-main GHCR digest}
    container_name: share-api
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # Exact-email sharing is the production composition. Operators can still
      # set both flags to false together for an explicit rollback, but an
      # ordinary reviewed image rollout must not silently ship auth-only.
      SHARE_SENDER_ENABLED: ${SHARE_SENDER_ENABLED:-true}
      SHARE_ACCOUNTLESS_RECEIVER_ENABLED: ${SHARE_ACCOUNTLESS_RECEIVER_ENABLED:-true}
      SHARE_AUTH_USERS_JSON: ${SHARE_AUTH_USERS_JSON-}
      SHARE_BINDING_STORE_ROOT: /var/lib/tinycloud/share
      SHARE_BINDING_STORE_PATH: ${SHARE_BINDING_STORE_PATH:-/var/lib/tinycloud/share/bindings.ndjson}
      SHARE_REGISTRY_UPLOAD_KEY_PATH: /var/lib/tinycloud/share/registry-upload.key
      SHARE_SENDER_ROOT_KEY_PATH: /var/lib/tinycloud/share/sender-root.key
      # The trust document is pinned inside the immutable image. Written as a
      # literal, not a `${...}` substitution, on purpose: the bundle holds no secret
      # (five public origins, two did:web ids, two key ids, two PUBLIC Ed25519
      # keys, two versions, two booleans), so changing it should be a reviewed
      # edit to a tracked file rather than a rewrite of the CVM's sealed
      # environment. Phala replaces sealed environment state on each deploy,
      # so production seals only the Cloudflare tunnel token.
      SHARE_TRUST_BUNDLE_SOURCE: committed
      # Node 1.16 policy admission is signed by the enrolled TEE did:key,
      # which is intentionally distinct from the public did:web Node audience.
      # Pin it as reviewed public trust material; never discover it dynamically
      # from the same runtime whose binding the browser is verifying.
      SHARE_NODE_ENFORCER_DID: did:key:z6MkjHi79SMX4doJyo2w7jDTM6Fa7iX6EVZWXNbJ6RzBm3Wi
      SHARE_RELEASE_PROVENANCE: ${SHARE_RELEASE_PROVENANCE:?set the immutable reviewed release provenance manifest}
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        unset SHARE_TRUST_BUNDLE_BASE64
        [ -n "$$SHARE_AUTH_USERS_JSON" ] || unset SHARE_AUTH_USERS_JSON
        exec npm run start:deploy
    volumes:
      - share-api-state:/var/lib/tinycloud/share
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
    restart: unless-stopped
    depends_on:
      share-api:
        condition: service_healthy
    command: tunnel --no-autoupdate --loglevel warn --url http://share-api:8787 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set the Cloudflare Tunnel token through Phala sealed environment storage}
    read_only: true
    tmpfs: [/tmp]

volumes:
  share-api-state:
