name: Links API Worker gates

on:
  push:
    branches: [main, feat/tc-2212-api-sol61]
    paths:
      - worker/links-api/**
      - .github/workflows/links-api.yml
  pull_request:
    paths:
      - worker/links-api/**
      - .github/workflows/links-api.yml

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker/links-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Isolate local test state
        run: |
          umask 077
          root=$(mktemp -d -p /var/tmp TC2212-ci-XXXXXXXX)
          printf '%s\n' "TC2212_TEST_ROOT=$root" "HOME=$root" "TMPDIR=$root" \
            "XDG_CONFIG_HOME=$root/config" "npm_config_cache=$root/npm-cache" \
            "BUN_INSTALL_CACHE_DIR=$root/bun-cache" "COURIER_HOME=$root/courier" \
            "TINYCLOUD_HOME=$root/tinycloud" "WRANGLER_SEND_METRICS=false" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Remove recorded private test state
        if: always()
        run: |
          if [ -n "${TC2212_TEST_ROOT:-}" ]; then
            rm -rf -- "$TC2212_TEST_ROOT"
          fi
