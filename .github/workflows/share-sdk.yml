name: Share SDK merge gates

# No `paths:` filter on purpose. This workflow is the repository's merge gate,
# and every previous attempt to enumerate what it depends on has been wrong:
# `npm test` already reads index.html, share.html, viewer.html, public/_headers
# and public/404.html and imports all of `src/`,
# none of which the old filter matched — so the gate silently skipped PRs it
# would have failed on. `npm run typecheck` widens the surface again to `src`,
# `packages`, `test`, `vite.config.ts` and `tsconfig.json`.
# Running unconditionally is cheaper than keeping that list correct.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"
      - run: npm ci
      # Fail the merge gate on a type error before running the browser and
      # email-worker unit suites.
      - run: npm run typecheck
      - run: npm test
