name: Share API Docker smoke
on:
  pull_request:
    paths:
      [
        Dockerfile.share-api,
        compose.share-api.yml,
        src/**,
        public/**,
        config/**,
        packages/**,
        package*.json,
        scripts/validate-deploy-config.mjs,
        .github/workflows/share-api-docker-smoke.yml,
      ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SHARE_API_IMAGE: ghcr.io/tinycloudlabs/share-api@sha256:c81b0d0d07713c1a2d045a2168c80071fb201475000000000000000000000000
      SHARE_RELEASE_PROVENANCE: >-
        {"releaseId":"ci-smoke","shareCommit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","nodeCommit":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","openCredentialsCommit":"cccccccccccccccccccccccccccccccccccccccc","sdkCommit":"dddddddddddddddddddddddddddddddddddddddd","shareApiImage":"ghcr.io/tinycloudlabs/share-api@sha256:c81b0d0d07713c1a2d045a2168c80071fb201475000000000000000000000000","configurationDigest":"sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee","migrationVersion":"ci-smoke","rollbackImage":"ghcr.io/tinycloudlabs/share-api@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff","rollbackReleaseId":"ci-previous"}
      CLOUDFLARE_TUNNEL_TOKEN: test-only-compose-token
      SHARE_SMOKE_TRUST_BUNDLE: >-
        {"version":"tinycloud.share-email-trust-bundle/v1","shareOrigin":"https://share.tinycloud.xyz","returnOrigin":"https://share.tinycloud.xyz","registryOrigin":"https://registry.tinycloud.xyz","credentialsOrigin":"https://witness.credentials.org","emailOrigin":"https://email.tinycloud.xyz","nodeOrigin":"https://node.tinycloud.xyz","nodeAudience":"did:web:node.tinycloud.xyz","nodeInvitationKid":"did:web:node.tinycloud.xyz#invitation-key-1","nodeInvitationPublicKey":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","nodeKeyVersion":1,"nodeEnabled":true,"issuerDid":"did:web:issuer.credentials.org","issuerVct":"opencredentials.email/v1","issuerKid":"did:web:issuer.credentials.org#email-signing-key-1","issuerPublicKey":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","issuerKeyVersion":1,"issuerEnabled":true}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate the production compose shape
        run: |
          docker compose -f compose.share-api.yml config --format json > "$RUNNER_TEMP/compose.json"
          jq -e '
            .services["share-api"].build == null and
            .services["share-api"].ports == null and
            .services["share-api"].environment.SHARE_SENDER_ENABLED == "true" and
            .services["share-api"].environment.SHARE_ACCOUNTLESS_RECEIVER_ENABLED == "true" and
            .services["share-api"].environment.SHARE_BINDING_STORE_PATH == "/var/lib/tinycloud/share/bindings.ndjson" and
            (.services["share-api"].environment | has("SHARE_SENDER_PRIVATE_KEY") | not) and
            (.services["share-api"].environment | has("SHARE_SENDER_CAPABILITY_JSON") | not) and
            (.services["share-api"].environment | has("SHARE_SENDER_CAPABILITIES_JSON") | not) and
            .services["share-api"].environment.SHARE_AUTH_USERS_JSON == "" and
            (.services["share-api"].environment | has("SHARE_TRUST_BUNDLE_BASE64") | not) and
            .services["share-api"].environment.SHARE_TRUST_BUNDLE_SOURCE == "committed" and
            .services.cloudflared.environment.TUNNEL_TOKEN == "test-only-compose-token" and
            .services.cloudflared.depends_on["share-api"].condition == "service_healthy"
          ' "$RUNNER_TEMP/compose.json" >/dev/null
      - run: docker build -f Dockerfile.share-api -t share-api-smoke .
      - run: |
          mkdir -p "$RUNNER_TEMP/share-state"
          chmod 0777 "$RUNNER_TEMP/share-state"
          docker run -d --name share-api-smoke -p 8787:8787 --read-only --tmpfs /tmp \
            -e SHARE_SENDER_ENABLED=false \
            -e SHARE_TRUST_BUNDLE="$SHARE_SMOKE_TRUST_BUNDLE" \
            -e SHARE_BINDING_STORE_PATH=/var/lib/tinycloud/share/bindings.ndjson \
            -v "$RUNNER_TEMP/share-state:/var/lib/tinycloud/share" share-api-smoke
          docker exec --user 1000:1000 share-api-smoke sh -eu -c '
            probe=/var/lib/tinycloud/share/non-root-smoke
            printf "%s\n" persisted > "$probe"
            test "$(cat "$probe")" = persisted
            rm "$probe"
            test ! -e "$probe"
          '
          attempt=0
          until curl -fsS http://127.0.0.1:8787/health/readiness; do
            attempt=$((attempt + 1))
            test "$attempt" -lt 30
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/health/readiness
          test "$(curl -fsS http://127.0.0.1:8787/health/readiness)" = '{"authReady":true,"senderReady":false}'
          test "$(curl -sS -o /tmp/nonce.json -w '%{http_code}' http://127.0.0.1:8787/api/share/auth/openkey/nonce)" = 400
          test "$(curl -sS -o /tmp/sender.json -w '%{http_code}' -X POST http://127.0.0.1:8787/share/v1/invitations/authorize -H 'content-type: application/json' --data '{}')" = 400
      # TC-372. Boot the image with NO trust material in the environment at all
      # and prove it publishes the committed production trust, unchanged.
      - name: Boot from the committed trust bundle with an empty environment
        run: |
          docker run -d --name share-api-committed -p 8788:8787 --read-only --tmpfs /tmp \
            -e SHARE_SENDER_ENABLED=false \
            -e SHARE_TRUST_BUNDLE_SOURCE=committed \
            share-api-smoke
          attempt=0
          until curl -fsS http://127.0.0.1:8788/health/readiness; do
            attempt=$((attempt + 1))
            test "$attempt" -lt 30
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/.well-known/tinycloud-share/config.json > "$RUNNER_TEMP/committed-config.json"
          jq -e --slurpfile committed config/trust-bundle.production.json '
            .shareOrigin == $committed[0].shareOrigin and
            .nodeOrigin == $committed[0].nodeOrigin and
            .nodeAudience == $committed[0].nodeAudience and
            .credentialsOrigin == $committed[0].credentialsOrigin and
            .emailOrigin == $committed[0].emailOrigin and
            .registryOrigin == $committed[0].registryOrigin and
            .nodeInvitationKid == $committed[0].nodeInvitationKid and
            .nodeInvitationPublicKey == $committed[0].nodeInvitationPublicKey and
            .issuerDid == $committed[0].issuerDid and
            .issuerPublicKey == $committed[0].issuerPublicKey and
            (has("environment") | not)
          ' "$RUNNER_TEMP/committed-config.json" >/dev/null
      - if: always()
        run: docker logs share-api-smoke || true
      - if: always()
        run: docker logs share-api-committed || true
