name: Share API image

on:
  push:
    branches: [main]
    # Must list everything `Dockerfile.share-api` COPYs into the image.
    # `config/**` and `packages/**` were missing, so TC-369 — a correction to
    # the committed trust bundle, which ships *inside* the image — merged to
    # main and published no new image at all. The CVM would have kept serving
    # the old key indefinitely while main looked fixed. Keep this list and the
    # Dockerfile's COPY lines in step.
    paths:
      - Dockerfile.share-api
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - packages/**
      - config/**
      - vite.config.ts
      - tsconfig.json
      - "*.html"
      - .github/workflows/share-api-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.share-api
          push: true
          tags: |
            ghcr.io/tinycloudlabs/share-api:sha-${{ github.sha }}
            ghcr.io/tinycloudlabs/share-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tinycloudlabs/share-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
