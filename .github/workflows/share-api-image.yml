name: Share API image

on:
  push:
    branches: [main]
    # Must list everything `Dockerfile.share-api` COPYs into the image.
    # `config/**` and `packages/**` were missing, so TC-369 — a correction to
    # the committed trust bundle, which ships *inside* the image — merged to
    # main and published no new image at all. The CVM would have kept serving
    # the old key indefinitely while main looked fixed. Keep this list and the
    # Dockerfile's COPY lines in step.
    paths:
      - Dockerfile.share-api
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - packages/**
      - config/**
      - vite.config.ts
      - tsconfig.json
      - "*.html"
      - .github/workflows/share-api-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.share-api
          push: true
          tags: |
            ghcr.io/tinycloudlabs/share-api:sha-${{ github.sha }}
            ghcr.io/tinycloudlabs/share-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tinycloudlabs/share-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # This artifact is the build action's output, rather than a later lookup
      # of the mutable sha-* tag. The production workflow consumes it by this
      # exact successful workflow-run id.
      - name: Record the published immutable image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "${GITHUB_SHA}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg image "ghcr.io/tinycloudlabs/share-api@${IMAGE_DIGEST}" \
            '{commit:$commit,digest:$digest,image:$image}' \
            > "${RUNNER_TEMP}/share-api-image-digest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: share-api-image-digest
          path: ${{ runner.temp }}/share-api-image-digest.json
          if-no-files-found: error
          retention-days: 90
