name: Sender encrypted share smoke (real OpenKey)

# TC-2933. A brand-new OpenKey account (email OTP through a private mail.tm inbox made per run)
# signs in to Share, makes a share for one named person (a second private inbox) and that
# person opens it with the emailed code, against production OpenKey and
# Node. The link-only share has its own check (sender-signin-smoke.yml); this one covers the
# encrypted addressed share.
#
# Runs by hand (workflow_dispatch) only. Each run makes one OpenKey account and one encrypted
# share link, which stay, and two throwaway mail.tm inboxes, deleted at the end of the run. A
# manual run opens live Share; with `candidate` it builds the dispatched ref and serves that
# build at https://share.tinycloud.xyz inside the runner's Chrome only.
#
# The push and daily triggers are paused: mail.tm refuses inbox creation from GitHub's shared
# runner addresses (HTTP 429). TC-3686 moves the inboxes to a mail source we control and
# re-enables both triggers in the same change. Restore them as they were: push to main on
# src/**, package.json, package-lock.json, this smoke and this workflow (the Cloudflare Pages
# wait step below runs on push only), and cron "47 6 * * *".
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Test this ref's build, not live Share"
        type: boolean
        default: false

# One run at a time: a run that is waiting starts when the running one ends, and none is cancelled.
concurrency:
  group: sender-encrypted-share-smoke
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the candidate
        if: inputs.candidate
        run: npm run build:deploy
      - name: Wait for Cloudflare Pages to deploy this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          for attempt in $(seq 1 30); do
            state=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=all&per_page=100" \
              | node .github/scripts/pages-check-state.mjs "$GITHUB_SHA")
            echo "Cloudflare Pages: ${state}"
            case "$state" in
              success) exit 0 ;;
              pending) ;;
              *) echo "Cloudflare Pages did not deploy ${GITHUB_SHA}"; exit 1 ;;
            esac
            sleep 20
          done
          echo "Cloudflare Pages did not finish within 10 minutes"; exit 1
      - name: Sender encrypted share smoke
        env:
          SHARE_SMOKE_CANDIDATE: ${{ inputs.candidate && 'dist' || '' }}
          SHARE_SMOKE_ARTIFACT: ${{ runner.temp }}/sender-encrypted-share-smoke.json
        run: node test/e2e-prod/sender-encrypted-share-smoke.mjs
      - name: Keep the scrubbed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sender-encrypted-share-smoke
          path: ${{ runner.temp }}/sender-encrypted-share-smoke.json
          if-no-files-found: ignore
          retention-days: 14
