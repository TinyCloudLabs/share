<!-- Until a person clicks Continue this page loads no SDK and makes no request beyond this origin's own static files. Continue loads OpenKey (frame-src) and the SDK, which talks to the person's own node and the location registry (connect-src https:). The app itself runs in the sandbox frame served from this origin or the user-content origin (frame-src; the build adds it), with connect-src 'none' inside it. This in-document CSP and public/_headers are both enforced. -->
