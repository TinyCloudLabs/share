<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q3 agent report</title>
  <style>
    body { margin: 32px; font: 16px/1.5 system-ui, sans-serif; color: #1d2433; background: #fff; }
    h1 { margin: 0 0 8px; color: rgb(42, 86, 246); font-size: 28px; letter-spacing: -0.02em; }
    table { border-collapse: collapse; margin: 16px 0; }
    td, th { padding: 6px 12px; border: 1px solid #d6dbe4; text-align: left; }
    .bar { display: inline-block; height: 10px; background: #2a56f6; border-radius: 2px; }
    button { min-height: 40px; padding: 6px 14px; font: inherit; }
  </style>
</head>
<body>
  <h1>Q3 agent report</h1>
  <p id="status">Script has not run.</p>
  <table id="metrics">
    <thead><tr><th>Metric</th><th>Value</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <button id="add" type="button">Add row</button>
  <script>
    var rows = [["Shares opened", 128], ["Pages published", 42], ["Median load (ms)", 310]];
    var body = document.querySelector("#metrics tbody");
    function addRow(label, value) {
      var tr = document.createElement("tr");
      var bar = document.createElement("span");
      bar.className = "bar";
      bar.style.width = Math.min(value, 300) + "px";
      [label, String(value)].forEach(function (text) {
        var td = document.createElement("td");
        td.textContent = text;
        tr.append(td);
      });
      var cell = document.createElement("td");
      cell.append(bar);
      tr.append(cell);
      body.append(tr);
    }
    rows.forEach(function (row) { addRow(row[0], row[1]); });
    document.getElementById("add").addEventListener("click", function () {
      addRow("Added in frame", body.children.length * 10);
    });
    document.getElementById("status").textContent = "Script ran inside the frame.";
  </script>
</body>
</html>
