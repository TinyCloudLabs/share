<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The viewer route's CSP and Trusted Types policy (viewer/index.html), so the parent side runs under the shipped constraints. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; font-src 'self'; frame-src 'self' https://openkey.so; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types share-viewer-html dompurify 'allow-duplicates'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HTML share browser harness</title>
</head>
<body>
<div id="viewer" tabindex="-1"></div>
<script type="module" src="./harness.ts"></script>
</body>
</html>
