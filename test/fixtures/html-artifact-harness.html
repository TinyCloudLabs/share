<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HTML artifact browser harness</title>
    <link rel="stylesheet" href="/src/viewer/viewer.css">
  </head>
  <body>
    <main id="harness-status" role="status">Loading artifact…</main>
    <script type="module">
      import { prepareHtmlArtifact } from "/src/artifact/bundle.ts";
      import { createArtifactSandbox } from "/src/viewer/artifact-sandbox.ts";
      import { mountArtifactChrome } from "/src/viewer/artifact-chrome.ts";
      import indexSource from "/examples/html-artifact/index.html?raw";
      import styleSource from "/examples/html-artifact/styles/site.css?raw";
      import scriptSource from "/examples/html-artifact/scripts/app.js?raw";
      import imageSource from "/examples/html-artifact/assets/cloud.svg?raw";

      const definitions = [
        ["index.html", indexSource, "text/html"],
        ["styles/site.css", styleSource, "text/css"],
        ["scripts/app.js", scriptSource, "text/javascript"],
        ["assets/cloud.svg", imageSource, "image/svg+xml"],
      ];
      try {
        const files = definitions.map(([path, source, mediaType]) => ({
          path,
          bytes: new TextEncoder().encode(source),
          mediaType,
        }));
        const artifact = await prepareHtmlArtifact(files);
        const stage = document.createElement("div");
        stage.id = "viewer";
        const main = document.createElement("main");
        main.className = "viewer-content viewer-content--frame";
        stage.append(main);
        document.body.append(stage);
        const sandbox = createArtifactSandbox(document, { mount: main });
        await sandbox.render(artifact);
        sandbox.iframe.hidden = false;
        document.body.classList.add("viewer-fullpage");
        document.getElementById("harness-status").remove();
        await mountArtifactChrome(document, {
          shareId: "browser-artifact-example",
          title: "index.html",
          provenance: "Sender unverified",
          expiry: { text: "Jan 1, 2030", datetime: "2030-01-01T00:00:00.000Z" },
          actions: [{ label: "Copy link", icon: "link", doneLabel: "Copied", doneMessage: "Link copied.", run: () => undefined }],
          mount: stage,
          frame: sandbox.iframe,
        });
        document.documentElement.dataset.ready = "yes";
      } catch (error) {
        console.error("Artifact harness failed", error);
        document.getElementById("harness-status").textContent = "Artifact failed to load.";
        document.documentElement.dataset.ready = "error";
      }
    </script>
  </body>
</html>
